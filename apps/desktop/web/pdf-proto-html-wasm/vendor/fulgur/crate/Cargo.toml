[package]
name = "fulgur-wasm-proto"
version = "0.1.0"
edition = "2024"
publish = false

# Copy of upstream crates/fulgur-wasm (publish = false upstream), built against
# the published fulgur 0.41.0 crate.
[lib]
crate-type = ["cdylib"]

[dependencies]
fulgur = "=0.41.0"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"

[profile.release]
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
