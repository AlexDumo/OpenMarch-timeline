  guide card in the page. v1 (all 17 ideas) is shape-ui-ideas.html.

<body>
<div id="app">
  <header id="top"><span class="brand">OpenMarch</span><span class="tag" style="margin:0 12px 0 8px;white-space:nowrap">PROTO v2</span><div id="topslot"></div></header>
  <main>
    <div id="stage"><svg id="fld"></svg><div id="ov"></div><div id="notes"></div></div>
    <aside id="panel"></aside>
  </main>
  <footer id="tl">
    <div class="muted" style="font-size:11px">Timeline (stub) · the shape sets positions at the playhead: <b style="color:var(--text)">count 33</b>, the end of Move 3</div>
    <div class="tlbar"><div class="tlmove" style="left:2%;width:22%">Move 1</div><div class="tlmove" style="left:26%;width:18%">Move 2</div><div class="tlmove" style="left:46%;width:20%">Move 3</div><div class="tlhead" style="left:66%"></div><div class="tlmove" style="left:68%;width:24%;opacity:.5">Move 4</div></div>
  </footer>
</div>
<div id="switcher"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const svg = $("#fld"), ov = $("#ov"), panel = $("#panel"), notesEl = $("#notes"), topslot = $("#topslot"), stage = $("#stage");
const FW = 160, FH = 84; // steps (8 to 5), front sideline is the bottom edge
const snap = (v) => Math.round(v * 2) / 2;
const snapP = (p) => ({ x: snap(p.x), y: snap(p.y) });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v) => { const r = Math.round(v * 10) / 10; return String(r); };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const deg = (r) => (r * 180) / Math.PI, rad = (d) => (d * Math.PI) / 180;
const clone = (o) => JSON.parse(JSON.stringify(o));

/* ---------------- band ---------------- */
function makeBand() {
  const ms = [];
  for (let i = 0; i < 12; i++) { const a = Math.PI * (1.15 + 0.7 * (i / 11)); ms.push({ id: "T" + (i + 1), x: snap(80 + 22 * Math.cos(a) + ((i % 3) - 1) * 0.8), y: snap(46 + 14 * Math.sin(a) + (i % 2) * 1.2) }); }
  for (let i = 0; i < 6; i++) ms.push({ id: "M" + (i + 1), x: 66 + i * 5.5, y: 52 });
  for (let i = 0; i < 8; i++) ms.push({ id: "F" + (i + 1), x: 44 + (i % 4) * 3, y: 58 + Math.floor(i / 4) * 4 });
  for (let i = 0; i < 6; i++) ms.push({ id: "C" + (i + 1), x: 106 + (i % 3) * 3, y: 58 + Math.floor(i / 3) * 4 });
  // more sections so selections can be odd-sized and in the dozens (about 110 on the field)
  for (let i = 0; i < 13; i++) ms.push({ id: "S" + (i + 1), x: 62 + i * 3, y: 61 });
  for (let i = 0; i < 24; i++) ms.push({ id: "B" + (i + 1), x: 58 + (i % 12) * 4, y: 19 + Math.floor(i / 12) * 3 });
  for (let i = 0; i < 40; i++) { const side = i < 20 ? 0 : 1, k = i % 20; ms.push({ id: "G" + (i + 1), x: (side ? 111 : 38) + (k % 5) * 3, y: 24 + Math.floor(k / 5) * 5 }); }
  return ms;
}
const num = (id) => +id.slice(1);
const GROUPS = {
  "1 marcher (T1)": (id) => id === "T1",
  "2 marchers": (id) => id === "T1" || id === "T2",
  "3 trumpets": (id) => id[0] === "T" && num(id) <= 3,
  "7 trumpets (odd)": (id) => id[0] === "T" && num(id) <= 7,
  Trumpets: (id) => id[0] === "T",
  "Saxes, 13 (odd)": (id) => id[0] === "S",
  "Low brass, 24": (id) => id[0] === "B",
  "Trumpets + saxes, 25 (odd)": (id) => id[0] === "T" || id[0] === "S",
  "Guard, 40": (id) => id[0] === "G",
  "All brass, 42": (id) => "TMB".includes(id[0]),
  "Guard + low brass, 64": (id) => id[0] === "G" || id[0] === "B",
  "Everyone, 109": () => true,
};
// rearrange the selected marchers before drawing, to try who-goes-where from different starts
function arrangeSel(kind) {
  const ms = selMs().sort((a, b) => a.id.localeCompare(b.id) || num(a.id) - num(b.id)), n = ms.length; if (!n) return;
  const c = selCenter(); let pts;
  if (kind === "line") pts = ms.map((_, i) => ({ x: c.x + (i - (n - 1) / 2) * 2, y: c.y }));
  else if (kind === "ring") { const R = Math.max(2, (n * 2) / (2 * Math.PI)); pts = ms.map((_, i) => ({ x: c.x + R * Math.cos((2 * Math.PI * i) / n), y: c.y + R * Math.sin((2 * Math.PI * i) / n) })); }
  else if (kind === "block") { const cols = Math.ceil(Math.sqrt(n)); pts = ms.map((_, i) => ({ x: c.x + ((i % cols) - (cols - 1) / 2) * 2, y: c.y + (Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2) * 2 })); }
  else { let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); const side = Math.sqrt(n) * 3.2; pts = [];
    for (const _ of ms) { let p, tries = 0; do { p = { x: c.x + (rnd() - 0.5) * side * 1.6, y: c.y + (rnd() - 0.5) * side }; tries++; } while (tries < 60 && pts.some((q) => dist(p, q) < 1.6)); pts.push(p); } }
  ms.forEach((m, i) => { m.x = snap(clamp(pts[i].x, 0, FW)); m.y = snap(clamp(pts[i].y, 0, FH)); });
}

/* ---------------- kinds ---------------- */
const KINDS = {
  line: { name: "Line", key: "L", icon: '<path d="M4 12H20"/><circle cx="4" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="20" cy="12" r="1.6"/>' },
  arc: { name: "Arc", key: "A", icon: '<path d="M4 17A8 8 0 0 1 20 17"/>' },
  circle: { name: "Circle", key: "O", icon: '<circle cx="12" cy="12" r="7.5"/>' },
  box: { name: "Box", key: "B", icon: '<rect x="5" y="6" width="14" height="12" rx="1"/><circle cx="9" cy="10" r="1.2"/><circle cx="15" cy="10" r="1.2"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/>' },
  diamond: { name: "Diamond", key: "D", icon: '<path d="M12 4l8 8-8 8-8-8z"/>' },
  triangle: { name: "Triangle", key: "T", icon: '<path d="M12 5l8 14H4z"/>' },
  wedge: { name: "Wedge", key: "V", icon: '<path d="M4 7l8 11 8-11"/>' },
  path: { name: "Curve", key: "C", icon: '<path d="M4 16C8 4 14 20 20 8"/>' },
};
const KIND_KEYS = Object.keys(KINDS);
const icon = (k) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${KINDS[k].icon}</svg>`;
const DEFAULT_PATH = [{ x: -0.5, y: 0.3 }, { x: -0.25, y: -0.5 }, { x: 0, y: 0 }, { x: 0.25, y: 0.5 }, { x: 0.5, y: -0.3 }];

function outlineLocal(s) {
  const w = s.w, h = s.h, P = [];
  switch (s.kind) {
    case "line": return { pts: [{ x: -w / 2, y: 0 }, { x: w / 2, y: 0 }], closed: false };
    case "arc": for (let i = 0; i <= 32; i++) { const t = Math.PI + (Math.PI * i) / 32; P.push({ x: (w / 2) * Math.cos(t), y: h / 2 + h * Math.sin(t) }); } return { pts: P, closed: false };
    case "circle": for (let i = 0; i < 48; i++) { const t = -Math.PI / 2 + (2 * Math.PI * i) / 48; P.push({ x: (w / 2) * Math.cos(t), y: (h / 2) * Math.sin(t) }); } return { pts: P, closed: true };
    case "box": return { pts: [{ x: -w / 2, y: -h / 2 }, { x: w / 2, y: -h / 2 }, { x: w / 2, y: h / 2 }, { x: -w / 2, y: h / 2 }], closed: true };
    case "diamond": return { pts: [{ x: 0, y: -h / 2 }, { x: w / 2, y: 0 }, { x: 0, y: h / 2 }, { x: -w / 2, y: 0 }], closed: true };
    case "triangle": return { pts: [{ x: 0, y: -h / 2 }, { x: w / 2, y: h / 2 }, { x: -w / 2, y: h / 2 }], closed: true };
    case "wedge": return { pts: [{ x: -w / 2, y: -h / 2 }, { x: 0, y: h / 2 }, { x: w / 2, y: -h / 2 }], closed: false };
    case "custom": return { pts: s.def.pts.map((p) => ({ x: p.x * w, y: p.y * h })), closed: !!s.def.closed };
    case "path": return { pts: smoothPath((s.pts || DEFAULT_PATH).map((p) => ({ x: p.x * w, y: p.y * h }))), closed: false };
  }
}
function smoothPath(pts) { // Catmull-Rom so a few clicked points read as a curve
  if (pts.length < 3) return pts;
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let t = 0; t < 1; t += 0.125) { const t2 = t * t, t3 = t2 * t;
      out.push({ x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
                 y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3) }); }
  }
  out.push(pts[pts.length - 1]); return out;
}
function samplePoly(pts, closed, n) {
  const seg = [], L = [0]; const m = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; seg.push([a, b]); L.push(L[L.length - 1] + dist(a, b)); }

/* ---------------- dimension labels (Q2B) ---------------- */
function dimsSVG(K) { const s = S.shape, n = S.sel.size, off = 16 / K; let h = ""; const L = (a, b) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;

  return h; }
function dimsHTML() { const s = S.shape, n = S.sel.size, iv = intervals(s, n), K = k(), off = 16 / K; const lab = (p, html) => { const q = toScreen(p); return `<div class="dim" style="left:${q.x}px;top:${q.y}px">${html}</div>`; }; const tok = (name, v) => `<span class="tok" data-edit="${name}" data-v="${v}">${v}</span>`; let h = "";

  else if (s.kind === "circle") { h += lab(toWorld(s, { x: (s.w / 4) * Math.cos(-Math.PI / 4), y: (s.h / 4) * Math.sin(-Math.PI / 4) }), `r ${tok("r", fmt(s.w / 2))}`); h += lab(toWorld(s, { x: 0, y: s.h / 2 + off }), `${n} · ${tok("apart", fmt(iv.apart))} apart`); }

  if (Math.abs(Math.sin(s.rot)) > 0.01) h += lab(toWorld(s, { x: s.w / 2 + off, y: -s.h / 2 - off }), `${tok("rot", Math.round(deg(s.rot)))}°`);
  return h; }
function editToken(el) { const name = el.dataset.edit; el.outerHTML = `<input data-tokin="${name}" value="${el.dataset.v}">`; const i = ov.querySelector(`[data-tokin="${name}"]`); i.focus(); i.select();
  let fired = false; const done = (ok) => { if (fired) return; fired = true; if (ok) { const v = +i.value; const s = S.shape, n = S.sel.size, iv = intervals(s, n); if (isFinite(v) && v > 0) {

/* ---------------- parsing (Q3D) ---------------- */
function cmdSug(q) { const parsed = parseCmd(q); const ex = ["box 4x3 2 steps", "circle r 6", "arc 2 apart", "line 1.5 steps", "company front", "wedge 2 apart rotated 180", "diamond 1.5 steps"].filter((x) => !q || x.startsWith(q.split(" ")[0]) || !parsed);
  return (parsed ? `<div class="hot">${icon(parsed.shape.kind)}<span>${parsed.label}</span><span class="ex" style="margin-left:auto">Enter</span></div>` : q ? `<div><span class="ex">Not sure what that is yet. Start with a shape name.</span></div>` : "") + ex.slice(0, 4).map((x) => `<div data-ex="${x}"><span class="ex">Try</span> ${x}</div>`).join(""); }
function parseCmd(q) { q = q.toLowerCase().trim(); if (!q) return null; const n = S.sel.size;
  const syn = [["company front", "line"], ["line", "line"], ["arc", "arc"], ["curve", "path"], ["circle", "circle"], ["ring", "circle"], ["box", "box"], ["block", "box"], ["rect", "box"], ["square", "box"], ["diamond", "diamond"], ["triangle", "triangle"], ["wedge", "wedge"], ["chevron", "wedge"], ["v ", "wedge"]];
  const hit = syn.find(([w]) => q.startsWith(w) || q.includes(" " + w)); if (!hit) return null; const kind = hit[1];
  const iv = +(q.match(/([\d.]+)\s*(steps?|apart|step)/)?.[1] || (q.match(/@\s*([\d.]+)/)?.[1]) || (hit[0] === "company front" ? 1.5 : 2));
  const s = autoShape(kind, n, iv || 2); const dims = q.match(/(\d+)\s*(x|by|×)\s*(\d+)/); let label = `${KINDS[kind].name} · ${n} marchers · ${fmt(iv)} steps apart`;
  if (dims && kind === "box") { const c = clamp(+dims[1], 1, n); s.cols = c; s.w = iv * (c - 1); s.h = iv * (Math.ceil(n / c) - 1); label = `Box ${c} × ${Math.ceil(n / c)} · ${fmt(iv)} apart`; }
  const r = q.match(/(?:r|radius)\s*([\d.]+)/); if (r && (kind === "circle" || kind === "arc")) { const R = +r[1]; s.w = 2 * R; s.h = kind === "circle" ? 2 * R : R; label = `${KINDS[kind].name} · radius ${fmt(R)} · ${fmt(intervals(s, n).apart)} apart`; }
  else if (kind === "circle" && /circle\s+(\d+)\s*$/.test(q)) { const R = +q.match(/circle\s+(\d+)/)[1]; s.w = s.h = 2 * R; label = `Circle · radius ${R} · ${fmt(intervals(s, n).apart)} apart`; }
  const rt = q.match(/(?:rotated?|turn(?:ed)?)\s*(-?[\d.]+)/); if (rt) { s.rot = rad(+rt[1]); label += ` · rotated ${rt[1]}°`; }
  return { shape: s, label }; }

/* ---------------- recognition (Q3E) ---------------- */
function recognize(st) { const n = S.sel.size; let len = 0; for (let i = 1; i < st.length; i++) len += dist(st[i - 1], st[i]); const a = st[0], b = st[st.length - 1], chord = dist(a, b);
  const xs = st.map((p) => p.x), ys = st.map((p) => p.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
  const bb = (kind) => ({ kind, cx: snap(cx), cy: snap(cy), w: snap(w), h: snap(h), rot: 0 });
  const asDrawn = () => { const pts = st.filter((_, i) => i % Math.max(1, Math.floor(st.length / 24)) === 0).concat([b]).map((p) => ({ x: (p.x - cx) / w, y: (p.y - cy) / h })); return { kind: "path", cx, cy, w, h, rot: 0, pts }; };
  const out = [];
  if (chord < 0.25 * len) { const err = (f) => st.reduce((t, p) => { const u = (p.x - cx) / (w / 2), v = (p.y - cy) / (h / 2); return t + Math.abs(f(u, v) - 1); }, 0) / st.length;
    const sc = [["circle", err((u, v) => Math.hypot(u, v))], ["box", err((u, v) => Math.max(Math.abs(u), Math.abs(v)))], ["diamond", err((u, v) => Math.abs(u) + Math.abs(v))], ["triangle", 0.35]].sort((p, q) => p[1] - q[1]);
    for (const [kd] of sc) { const s = bb(kd); if (kd === "circle" && Math.abs(w - h) / Math.max(w, h) < 0.25) s.w = s.h = snap((w + h) / 2); if (kd === "box") s.cols = boxSplit(s, n).cols; out.push({ shape: s }); } }
  else { const ang = Math.atan2(b.y - a.y, b.x - a.x); if (chord / len > 0.9) out.push({ shape: shapeFromDrag("line", snapP(a), snapP(b)) });
    let far = 0, fi = 0; const nx = -(b.y - a.y) / chord, ny = (b.x - a.x) / chord; st.forEach((p, i) => { const d = (p.x - a.x) * nx + (p.y - a.y) * ny; if (Math.abs(d) > Math.abs(far)) { far = d; fi = i; } });
    const seg = (i0, i1) => { let l = 0; for (let i = i0 + 1; i <= i1; i++) l += dist(st[i - 1], st[i]); return dist(st[i0], st[i1]) / (l || 1); };
    const wedgeish = seg(0, fi) > 0.93 && seg(fi, st.length - 1) > 0.93;
    const arc = { kind: "arc", w: chord, h: Math.abs(far), rot: ang, fy: far > 0 ? -1 : 1 }; const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; arc.cx = m.x + nx * far / 2; arc.cy = m.y + ny * far / 2;
    const wedge = { ...arc, kind: "wedge", fy: far > 0 ? 1 : -1 };
    if (wedgeish) out.push({ shape: wedge }, { shape: arc }); else out.push({ shape: arc }, { shape: wedge });
    if (chord / len <= 0.9) out.push({ shape: shapeFromDrag("line", snapP(a), snapP(b)) }); }
  out.push({ shape: asDrawn() }); return out; }

function convexHull(P) { const pts = P.slice().sort((a, b) => a.x - b.x || a.y - b.y); if (pts.length < 3) return pts; const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1)); }

/* ---------------- events ---------------- */
svg.addEventListener("wheel", (e) => { e.preventDefault(); const p = toField(e), v = S.view, f = Math.exp(e.deltaY * 0.0015), w = clamp(v.w * f, 30, 180), h = (w * 51.6) / 88;

  let d = Vt.down ? Vt.down(hit, p, e) : undefined; if (d === undefined) d = e.button === 2 ? null : stdDown(hit, p, e);
