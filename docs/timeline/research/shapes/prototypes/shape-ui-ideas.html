/* ---------------- kinds ---------------- */
const KINDS = {

  diamond: { name: "Diamond", key: "D", icon: '<path d="M12 4l8 8-8 8-8-8z"/>' },

  wedge: { name: "Wedge", key: "V", icon: '<path d="M4 7l8 11 8-11"/>' },

const KIND_KEYS = Object.keys(KINDS);
const icon = (k) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${KINDS[k].icon}</svg>`;
const DEFAULT_PATH = [{ x: -0.5, y: 0.3 }, { x: -0.25, y: -0.5 }, { x: 0, y: 0 }, { x: 0.25, y: 0.5 }, { x: 0.5, y: -0.3 }];

function outlineLocal(s) {
  const w = s.w, h = s.h, P = [];

    case "line": return { pts: [{ x: -w / 2, y: 0 }, { x: w / 2, y: 0 }], closed: false };
    case "arc": for (let i = 0; i <= 32; i++) { const t = Math.PI + (Math.PI * i) / 32; P.push({ x: (w / 2) * Math.cos(t), y: h / 2 + h * Math.sin(t) }); } return { pts: P, closed: false };

    case "diamond": return { pts: [{ x: 0, y: -h / 2 }, { x: w / 2, y: 0 }, { x: 0, y: h / 2 }, { x: -w / 2, y: 0 }], closed: true };
    case "triangle": return { pts: [{ x: 0, y: -h / 2 }, { x: w / 2, y: h / 2 }, { x: -w / 2, y: h / 2 }], closed: true };
    case "wedge": return { pts: [{ x: -w / 2, y: -h / 2 }, { x: 0, y: h / 2 }, { x: w / 2, y: -h / 2 }], closed: false };

}
function smoothPath(pts) { // Catmull-Rom so a few clicked points read as a curve

    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];

function autoShape(kind, n, iv = 2, at) {

}

  const out = [];
  if (chord < 0.25 * len) { const err = (f) => st.reduce((t, p) => { const u = (p.x - cx) / (w / 2), v = (p.y - cy) / (h / 2); return t + Math.abs(f(u, v) - 1); }, 0) / st.length;
    const sc = [["circle", err((u, v) => Math.hypot(u, v))], ["box", err((u, v) => Math.max(Math.abs(u), Math.abs(v)))], ["diamond", err((u, v) => Math.abs(u) + Math.abs(v))], ["triangle", 0.35]].sort((p, q) => p[1] - q[1]);
    for (const [kd] of sc) { const s = bb(kd); if (kd === "circle" && Math.abs(w - h) / Math.max(w, h) < 0.25) s.w = s.h = snap((w + h) / 2); if (kd === "box") s.cols = boxSplit(s, n).cols; out.push({ shape: s }); } }
  else { const ang = Math.atan2(b.y - a.y, b.x - a.x); if (chord / len > 0.9) out.push({ shape: shapeFromDrag("line", snapP(a), snapP(b)) });
    let far = 0, fi = 0; const nx = -(b.y - a.y) / chord, ny = (b.x - a.x) / chord; st.forEach((p, i) => { const d = (p.x - a.x) * nx + (p.y - a.y) * ny; if (Math.abs(d) > Math.abs(far)) { far = d; fi = i; } });
    const seg = (i0, i1) => { let l = 0; for (let i = i0 + 1; i <= i1; i++) l += dist(st[i - 1], st[i]); return dist(st[i0], st[i1]) / (l || 1); };
    const wedgeish = seg(0, fi) > 0.93 && seg(fi, st.length - 1) > 0.93;
    const arc = { kind: "arc", w: chord, h: Math.abs(far), rot: ang, fy: far > 0 ? -1 : 1 }; const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; arc.cx = m.x + nx * far / 2; arc.cy = m.y + ny * far / 2;
    const wedge = { ...arc, kind: "wedge", fy: far > 0 ? 1 : -1 };
    if (wedgeish) out.push({ shape: wedge }, { shape: arc }); else out.push({ shape: arc }, { shape: wedge });
    if (chord / len <= 0.9) out.push({ shape: shapeFromDrag("line", snapP(a), snapP(b)) }); }
  out.push({ shape: asDrawn() }); return out; }

function convexHull(P) { const pts = P.slice().sort((a, b) => a.x - b.x || a.y - b.y); if (pts.length < 3) return pts; const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1)); }

/* ---------------- events ---------------- */
svg.addEventListener("wheel", (e) => { e.preventDefault(); const p = toField(e), v = S.view, f = Math.exp(e.deltaY * 0.0015), w = clamp(v.w * f, 30, 180), h = (w * 51.6) / 88;
  S.view = { x: p.x - ((p.x - v.x) * w) / v.w, y: p.y - ((p.y - v.y) * h) / v.h, w, h }; S.force = true; render(); }, { passive: false });
svg.addEventListener("pointerdown", (e) => { if (e.button === 1 || (e.button === 0 && V.space)) { e.preventDefault(); const c0 = { x: e.clientX, y: e.clientY }, v0 = { ...S.view }; S.drag = { move: (_, ev) => { const kk = k(); S.view = { ...v0, x: v0.x - (ev.clientX - c0.x) / kk, y: v0.y - (ev.clientY - c0.y) / kk }; S.force = true; }, up() {} }; svg.setPointerCapture(e.pointerId); return; } const p = toField(e); S.mouse = p; const hit = hitTest(e, p); const Vt = cur();
  let d = Vt.down ? Vt.down(hit, p, e) : undefined; if (d === undefined) d = e.button === 2 ? null : stdDown(hit, p, e);
  if (d) { S.drag = d; svg.setPointerCapture(e.pointerId); } render(); });
svg.addEventListener("pointermove", (e) => { const p = toField(e); S.mouse = p; if (S.drag) S.drag.move(p, e); cur().hover?.(p, e); render(); });
svg.addEventListener("pointerup", (e) => { if (S.drag) { S.drag.up?.(toField(e), e); S.drag = null; } render(); });
stage.addEventListener("contextmenu", (e) => { if (cur().context?.(toField(e), e)) { e.preventDefault(); render(); } });
function onAct(e) { const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act; if (!(cur().act?.(a, el))) act(a, el); S.force = true; render(); }
ov.addEventListener("click", onAct); panel.addEventListener("click", onAct); topslot.addEventListener("click", onAct);
document.getElementById("switcher").addEventListener("click", onAct);
panel.addEventListener("change", (e) => { const n = e.target.dataset?.in; if (n) { cur().input?.(n, e.target.value); S.force = true; render(); } });
window.addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.key === "Enter" && e.target.dataset?.in) { e.target.dispatchEvent(new Event("change", { bubbles: true })); } return; }
  if (cur().key?.(e, true)) { e.preventDefault(); render(); return; }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { go(S.q, (S.v + (e.key === "ArrowRight" ? 1 : -1) + QS[S.q].variants.length) % QS[S.q].variants.length); return; }
  if (e.key === "Enter") { place(); render(); } if (e.key === "Escape") { V.ring = null; S.shape = null; render(); }
  if (e.key === "[" ) { act("cols-"); render(); } if (e.key === "]") { act("cols+"); render(); } });
window.addEventListener("keyup", (e) => { if (e.target.tagName === "INPUT") return; if (cur().key?.(e, false)) render(); });
window.addEventListener("resize", () => { S.force = true; render(); });

/* ---------------- switcher + notes ---------------- */
function go(q, v, keepShape) {
  cur().leave?.(); S.q = q; S.v = v; V = {}; S.drag = null; S.tip = null; S.order = "nearest"; S.keepSpacing = false; if (!keepShape) S.shape = null;
  const Vt = cur(); if (Vt.setup && S.sel.size) Vt.setup();
  const L = "ABCDE"[v]; try { history.replaceState(null, "", `?q=${q + 1}&v=${L}`); } catch { location.hash = `q=${q + 1}&v=${L}`; }
  notesEl.classList.remove("min");
  notesEl.innerHTML = `<div class="hdr"><div><div class="q">Question ${q + 1} · ${QS[q].title}</div><h3>${L}. ${Vt.name}</h3></div><button class="ghost" data-min title="Hide notes">–</button></div><div>${Vt.idea}</div><div class="lbl">Try</div><ul>${Vt.tryit.map((t) => `<li>${t}</li>`).join("")}</ul><div class="lbl">Good</div><div>${Vt.pros}</div><div class="lbl">Watch out</div><div>${Vt.cons}</div><div class="muted" style="margin-top:8px;font-size:11px">Scroll to zoom · middle-drag to pan · ← → change idea</div>`;
  notesEl.querySelector("[data-min]").onclick = () => notesEl.classList.toggle("min");
  drawSwitcher(); S.force = true; render();
}
function drawSwitcher() { const sw = document.getElementById("switcher"); const vs = QS[S.q].variants;
  sw.innerHTML = QS.map((qq, i) => `<button class="${i === S.q ? "on" : ""}" data-q="${i}" title="${qq.title}">${i + 1}. ${qq.short}</button>`).join("") + `<span class="sep"></span><button data-v="-1">←</button><span class="vl">${"ABCDE"[S.v]} · ${vs[S.v].name} <span style="font-weight:400;color:#666">(${S.v + 1}/${vs.length})</span></span><button data-v="1">→</button><span class="sep"></span><select id="grp">${Object.keys(GROUPS).map((g) => `<option ${g === S.group ? "selected" : ""}>${g}</option>`).join("")}${S.group ? "" : "<option selected>Custom</option>"}</select><button data-reset>Reset</button>`;
  sw.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => go(+b.dataset.q, 0)));
  sw.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => go(S.q, (S.v + +b.dataset.v + vs.length) % vs.length)));
  sw.querySelector("[data-reset]").onclick = () => { S.ms = clone(HOME); S.undo = null; go(S.q, S.v); };
  sw.querySelector("#grp").onchange = (e) => { setGroup(e.target.value); go(S.q, S.v); }; }

const qs = new URLSearchParams(location.hash.length > 1 ? location.hash.slice(1) : location.search);
go(clamp((+qs.get("q") || 1) - 1, 0, QS.length - 1), Math.max(0, "ABCDE".indexOf((qs.get("v") || "A").toUpperCase())));
requestAnimationFrame(() => { S.force = true; render(); });
</script>
</body>
