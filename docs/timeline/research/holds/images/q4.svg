pacity="1"/><text x="49.0" y="502" font-size="10" fill="#059669" text-anchor="middle" font-weight="bold">PROPOSED</text><text x="10" y="525" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Or, in Expert</text><text x="10" y="540" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">one step</text><line x1="554" y1="490" x2="554" y2="546" stroke="#059669" stroke-width="2.5"/><path d="M554,490 l12,5 l-12,5 z" fill="#059669"/><text x="568" y="499" font-size="11" fill="#059669" text-anchor="start" font-weight="bold">start flag</text><line x1="734" y1="490" x2="734" y2="546" stroke="#dc2626" stroke-width="2.5"/><path d="M734,490 l12,5 l-12,5 z" fill="#dc2626"/><text x="748" y="499" font-size="11" fill="#dc2626" text-anchor="start" font-weight="bold">playhead</text><path d="M374,512 L382,520 L374,528 L366,520 z" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="374" y="515" width="180" height="10" rx="5" fill="#059669" stroke="none" stroke-width="1" opacity="1"/><rect x="555" y="511" width="178" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" opacity="1"/><text x="764" y="522" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Arrives after the hold → it&#x27;s leaving it.</text></svg>